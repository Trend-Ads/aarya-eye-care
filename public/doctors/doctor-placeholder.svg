<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBE2D3" />
      <stop offset="50%" stop-color="#DDCFB9" />
      <stop offset="100%" stop-color="#CBBCA5" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECECEC" />
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E5538" />
      <stop offset="100%" stop-color="#675E31" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  <circle cx="300" cy="280" r="240" fill="url(#glow)" />

  <!-- Subtle Medical Background Pattern -->
  <g opacity="0.12" stroke="#675E31" stroke-width="1.5" fill="none">
    <circle cx="300" cy="400" r="180" stroke-dasharray="6 6"/>
    <circle cx="300" cy="400" r="260" stroke-dasharray="4 8"/>
    <!-- Optical crosshairs -->
    <line x1="120" y1="400" x2="480" y2="400" />
    <line x1="300" y1="220" x2="300" y2="580" />
  </g>

  <!-- Doctor Silhouette -->
  <g transform="translate(0, 40)">
    <!-- Shoulders & Clinical Coat -->
    <path d="M 140 680 C 140 520, 200 450, 300 450 C 400 450, 460 520, 460 680 L 480 760 L 120 760 Z" fill="url(#coatGrad)" filter="drop-shadow(0 15px 25px rgba(48,41,31,0.15))"/>
    
    <!-- Inner Scrub / Shirt -->
    <path d="M 260 450 L 300 550 L 340 450 Z" fill="url(#scrubGrad)" />
    
    <!-- Coat Lapels -->
    <path d="M 230 450 L 260 580 L 210 650 L 190 510 Z" fill="#E2E2E2" />
    <path d="M 370 450 L 340 580 L 390 650 L 410 510 Z" fill="#E2E2E2" />
    
    <!-- Stethoscope -->
    <path d="M 245 470 C 245 560, 275 600, 300 600 C 325 600, 355 560, 355 470" fill="none" stroke="#675E31" stroke-width="6" stroke-linecap="round" />
    <circle cx="300" cy="620" r="14" fill="#675E31" stroke="#F2E9DC" stroke-width="3" />

    <!-- Neck -->
    <rect x="272" y="380" width="56" height="85" rx="10" fill="#D8BC9E" />

    <!-- Head / Face Silhouette -->
    <ellipse cx="300" cy="310" rx="72" ry="92" fill="#DFC7AC" />
    <!-- Hair Stylized -->
    <path d="M 228 310 C 225 215, 375 215, 372 310 C 360 210, 240 210, 228 310 Z" fill="#30291F" />
  </g>

  <!-- Hospital Brand Emblem Tag at Top -->
  <g transform="translate(300, 75)" text-anchor="middle">
    <circle cx="0" cy="0" r="28" fill="#F2E9DC" stroke="#C9A581" stroke-width="2" />
    <!-- Eye Icon -->
    <path d="M -14 0 Q 0 -10 14 0 Q 0 10 -14 0 Z" fill="none" stroke="#675E31" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="4.5" fill="#A55322" />
    <text y="48" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#675E31">AARYA EYE CARE</text>
    <text y="64" font-family="sans-serif" font-size="10" font-weight="500" letter-spacing="1.5" fill="#8C7E6A">SPECIALIST CONSULTANT</text>
  </g>
</svg>